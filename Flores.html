<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Árbol de Flores Amarillas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f6f0;
      font-family: 'Segoe UI', Georgia, serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Botón inicial con pulso dorado */
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.5s ease, transform 0.3s ease;
    }

    #start-btn .flower-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #3d2314 35%, #ffd700 36%);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
      position: relative;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 35px rgba(255, 215, 0, 0.9); }
    }

    #start-btn span {
      margin-top: 15px;
      font-size: 15px;
      color: #333;
      font-weight: 700;
      background: #ffffffee;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #ffd700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Canvas para renderizar */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Contenedor del texto poético */
    #text-container {
      position: absolute;
      left: 4%;
      top: 10%;
      width: 42%;
      max-width: 320px;
      z-index: 5;
      color: #2c2c2c;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(4px);
      padding: 15px;
      border-radius: 12px;
    }

    #text-container h2 {
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      font-weight: 700;
      color: #b8860b;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    #text-container p {
      font-size: 0.82rem;
      line-height: 1.6;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: pre-line;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }

    #text-container .footer-note {
      margin-top: 15px;
      font-size: 0.85rem;
      font-style: italic;
      text-transform: none;
      font-weight: 500;
      border-top: 1.5px solid #d4af37;
      padding-top: 8px;
      color: #333;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: #333;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="start-btn" onclick="startAnimation()">
      <div class="flower-icon"></div>
      <span>Click Aquí 🌻</span>
    </div>

    <canvas id="treeCanvas"></canvas>

    <div id="text-container">
      <h2 id="title"></h2>
      <p id="typed-text"></p>
      <div id="footer-text" class="footer-note"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let treeOffsetX = 0; 
    let targetOffsetX = 0;

    let trunkProgress = 0;
    let branchProgress = 0;
    let flowerProgress = 0;
    let animState = 'idle';

    const fallingFlowers = [];

    // Dibujar el paisaje pintoresco
    function drawLandscape() {
      ctx.clearRect(0, 0, width, height);

      // 1. Cielo con degradado cálido al atardecer
      const skyGradient = ctx.createLinearGradient(0, 0, 0, height * 0.85);
      skyGradient.addColorStop(0, '#87CEEB');   // Azul claro
      skyGradient.addColorStop(0.55, '#FFF0F5'); // Tono cálido pastel
      skyGradient.addColorStop(1, '#FFE4B5');   // Dorado atardecer
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, width, height);

      // 2. Sol resplandeciente
      const sunX = width * 0.8;
      const sunY = height * 0.22;
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 120);
      sunGlow.addColorStop(0, 'rgba(255, 255, 220, 1)');
      sunGlow.addColorStop(0.3, 'rgba(255, 223, 0, 0.6)');
      sunGlow.addColorStop(1, 'rgba(255, 223, 0, 0)');
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 120, 0, Math.PI * 2);
      ctx.fill();

      // 3. Montañas suaves en el fondo
      ctx.fillStyle = '#b2c8af';
      ctx.beginPath();
      ctx.moveTo(0, height * 0.8);
      ctx.quadraticCurveTo(width * 0.25, height * 0.68, width * 0.5, height * 0.8);
      ctx.quadraticCurveTo(width * 0.75, height * 0.65, width, height * 0.82);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      // 4. Colinas verdes principales (Suelo)
      const groundGradient = ctx.createLinearGradient(0, height * 0.75, 0, height);
      groundGradient.addColorStop(0, '#558b2f'); // Verde brillante
      groundGradient.addColorStop(1, '#2e7d32'); // Verde profundo
      ctx.fillStyle = groundGradient;
      ctx.beginPath();
      ctx.moveTo(0, height * 0.82);
      ctx.quadraticCurveTo(width * 0.35, height * 0.76, width * 0.7, height * 0.83);
      ctx.quadraticCurveTo(width * 0.88, height * 0.85, width, height * 0.82);
      ctx.lineTo(width, height);
      ctx.lineTo(0, height);
      ctx.fill();

      const centerX = width / 2 + treeOffsetX;
      const groundY = height * 0.81;

      // Punto inicial rojo de brote
      if (animState !== 'idle') {
        ctx.beginPath();
        ctx.arc(centerX, groundY, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#e53935';
        ctx.fill();
      }
    }

    // Dibujar un girasol
    function drawSunflower(x, y, radius, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      if (angle !== 0) ctx.rotate(angle);

      const petalCount = 12;
      ctx.fillStyle = '#fbc02d';
      for (let i = 0; i < petalCount; i++) {
        ctx.beginPath();
        ctx.rotate((Math.PI * 2) / petalCount);
        ctx.ellipse(0, radius * 0.65, radius * 0.3, radius * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = '#3d2314';
      ctx.fill();

      ctx.restore();
    }

    // Estructura interna de apoyo
    const branchStructures = [
      { sx: 0, sy: -140, ex: -75, ey: -230, w: 12 },
      { sx: 0, sy: -140, ex: 75, ey: -230, w: 12 },
      { sx: 0, sy: -180, ex: -35, ey: -300, w: 9 },
      { sx: 0, sy: -180, ex: 35, ey: -300, w: 9 },
      { sx: -75, sy: -230, ex: -125, ey: -330, w: 7 },
      { sx: 75, sy: -230, ex: 125, ey: -330, w: 7 },
      { sx: -75, sy: -230, ex: -60, ey: -380, w: 7 },
      { sx: 75, sy: -230, ex: 60, ey: -380, w: 7 },
      { sx: 0, sy: -220, ex: 0, ey: -410, w: 8 }
    ];

    // Generar exactamente 1000 flores para la copa tupida en corazón
    const heartFlowers = [];
    function generateHeartFlowers() {
      heartFlowers.length = 0;
      const totalFlowers = 1000;
      
      for (let i = 0; i < totalFlowers; i++) {
        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());
        
        let hx = 16 * Math.pow(Math.sin(t), 3);
        let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        const scaleFactor = 14;
        hx *= r * scaleFactor;
        hy *= r * scaleFactor;

        heartFlowers.push({
          x: hx,
          y: hy - 290,
          size: 9 + Math.random() * 5.5,
          delay: Math.random()
        });
      }
    }

    // Agregar flor que cae estilo otoño
    function spawnFallingFlower() {
      const centerX = width / 2 + treeOffsetX;
      const groundY = height * 0.81;

      if (heartFlowers.length === 0) return;
      const sourceFlower = heartFlowers[Math.floor(Math.random() * heartFlowers.length)];

      fallingFlowers.push({
        x: centerX + sourceFlower.x,
        y: groundY + sourceFlower.y,
        size: sourceFlower.size * 0.85,
        speedY: 0.8 + Math.random() * 0.8,
        swaySpeed: 0.02 + Math.random() * 0.02,
        swayAmount: 1.2 + Math.random() * 1.5,
        angle: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.03,
        time: Math.random() * 100
      });
    }

    // Bucle principal
    function loop() {
      drawLandscape();

      const centerX = width / 2 + treeOffsetX;
      const groundY = height * 0.81;

      // 1. Tallo Verde Grande
      if (trunkProgress > 0) {
        ctx.beginPath();
        ctx.moveTo(centerX, groundY);
        const currentTrunkHeight = 210 * trunkProgress;
        
        ctx.quadraticCurveTo(
          centerX - 10, groundY - currentTrunkHeight / 2, 
          centerX, groundY - currentTrunkHeight
        );
        ctx.strokeStyle = '#1b5e20';
        ctx.lineWidth = 26;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // 2. Ramas (Ocultas gradualmente)
      if (branchProgress > 0 && flowerProgress < 0.9) {
        branchStructures.forEach(b => {
          ctx.beginPath();
          ctx.moveTo(centerX + b.sx, groundY + b.sy);
          
          const curEx = b.sx + (b.ex - b.sx) * branchProgress;
          const curEy = b.sy + (b.ey - b.sy) * branchProgress;
          
          ctx.lineTo(centerX + curEx, groundY + curEy);
          ctx.strokeStyle = '#1b5e20';
          ctx.lineWidth = b.w;
          ctx.stroke();
        });
      }

      // 3. Florecimiento paulatino
      if (flowerProgress > 0) {
        heartFlowers.forEach(f => {
          if (flowerProgress >= f.delay) {
            const scale = Math.min(1, (flowerProgress - f.delay) * 2.2);
            drawSunflower(centerX + f.x, groundY + f.y, f.size * scale);
          }
        });
      }

      // 4. Caída de Flores de Otoño
      if (flowerProgress >= 1) {
        if (Math.random() < 0.09) {
          spawnFallingFlower();
        }

        for (let i = fallingFlowers.length - 1; i >= 0; i--) {
          const f = fallingFlowers[i];
          f.time += f.swaySpeed;
          f.x += Math.sin(f.time) * f.swayAmount;
          f.y += f.speedY;
          f.angle += f.rotSpeed;

          drawSunflower(f.x, f.y, f.size, f.angle);

          if (f.y >= groundY - 5) {
            fallingFlowers.splice(i, 1);
          }
        }
      }

      // Control del ritmo de animación
      if (animState === 'trunk') {
        trunkProgress += 0.018;
        if (trunkProgress >= 1) {
          trunkProgress = 1;
          animState = 'branches';
        }
      } else if (animState === 'branches') {
        branchProgress += 0.022;
        if (branchProgress >= 1) {
          branchProgress = 1;
          animState = 'flowers';
        }
      } else if (animState === 'flowers') {
        flowerProgress += 0.006;
        if (flowerProgress >= 1) {
          flowerProgress = 1;
          setTimeout(() => {
            animState = 'shift';
            targetOffsetX = width * 0.22;
          }, 700);
        }
      } else if (animState === 'shift') {
        treeOffsetX += (targetOffsetX - treeOffsetX) * 0.04;
        if (Math.abs(targetOffsetX - treeOffsetX) < 1) {
          treeOffsetX = targetOffsetX;
          animState = 'typing';
          startTypingEffect();
        }
      }

      requestAnimationFrame(loop);
    }

    function startAnimation() {
      document.getElementById('start-btn').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('start-btn').style.display = 'none';
      }, 500);

      generateHeartFlowers();
      animState = 'trunk';
    }

    // Efecto de mecanografía
    function startTypingEffect() {
      const titleEl = document.getElementById('title');
      const textEl = document.getElementById('typed-text');
      const footerEl = document.getElementById('footer-text');

      const titleText = "🌻 FELIZ DÍA DE LAS FLORES AMARILLAS 🌻";
      const bodyText = "CADA GIRASOL QUE VES\nAQUÍ ES UN LATIDO DE MI\nCORAZÓN.\nASÍ COMO EL SOL ILUMINA\nLOS CAMPOS, TÚ ILUMINAS\nMI VIDA.\nQUE ESTAS FLORES TE\nRECUERDEN LO ESPECIAL\nQUE ERES PARA MÍ.\n¡TE AMO!";
      const footerText = "Eres el sol que hace florecer cada uno de mis días.";

      let i = 0;
      titleEl.innerHTML = '<span class="cursor"></span>';
      
      function typeTitle() {
        if (i < titleText.length) {
          titleEl.innerHTML = titleText.substring(0, i + 1) + '<span class="cursor"></span>';
          i++;
          setTimeout(typeTitle, 40);
        } else {
          titleEl.innerHTML = titleText;
          typeBody();
        }
      }

      let j = 0;
      function typeBody() {
        textEl.innerHTML = '<span class="cursor"></span>';
        function stepBody() {
          if (j < bodyText.length) {
            textEl.innerHTML = bodyText.substring(0, j + 1) + '<span class="cursor"></span>';
            j++;
            setTimeout(stepBody, 30);
          } else {
            textEl.innerHTML = bodyText;
            typeFooter();
          }
        }
        stepBody();
      }

      let k = 0;
      function typeFooter() {
        footerEl.innerHTML = '<span class="cursor"></span>';
        function stepFooter() {
          if (k < footerText.length) {
            footerEl.innerHTML = footerText.substring(0, k + 1) + '<span class="cursor"></span>';
            k++;
            setTimeout(stepFooter, 30);
          } else {
            footerEl.innerHTML = footerText;
          }
        }
        stepFooter();
      }

      typeTitle();
    }

    loop();
  </script>
</body>
</html>
